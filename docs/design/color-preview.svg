<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Paleta de colores del sistema visual MACHUCO</title>
  <desc id="desc">Muestras de fondos, superficies, texto, colores de marca y estados semánticos.</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#8B5CF6"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#D946EF"/></linearGradient>
    <style>.h{font:700 22px Inter,Arial;fill:#F8F6FF}.s{font:700 15px Inter,Arial;fill:#F8F6FF}.n{font:500 12px Inter,Arial;fill:#B9B4C2}.dark{fill:#21152C}.light{fill:#F8F6FF}</style>
  </defs>
  <rect width="960" height="610" rx="24" fill="#0D0913"/>
  <text x="40" y="48" class="h">Paleta MACHUCO · Dark mode</text>
  <text x="40" y="78" class="n">Los nombres corresponden a los design tokens de Flutter.</text>
  <text x="40" y="118" class="s">Fondos y superficies</text>
  <g transform="translate(40 138)">
    <g><rect width="164" height="90" rx="14" fill="#0D0913" stroke="#ffffff" stroke-opacity=".14"/><text x="14" y="59" class="light" font-family="Inter,Arial" font-size="13">backgroundCanvas</text><text x="14" y="78" class="n">#0D0913</text></g>
    <g transform="translate(180)"><rect width="164" height="90" rx="14" fill="#100B18" stroke="#ffffff" stroke-opacity=".14"/><text x="14" y="59" class="light" font-family="Inter,Arial" font-size="13">background</text><text x="14" y="78" class="n">#100B18</text></g>
    <g transform="translate(360)"><rect width="164" height="90" rx="14" fill="#15111F" stroke="#ffffff" stroke-opacity=".14"/><text x="14" y="59" class="light" font-family="Inter,Arial" font-size="13">surface</text><text x="14" y="78" class="n">#15111F</text></g>
    <g transform="translate(540)"><rect width="164" height="90" rx="14" fill="#21182B"/><text x="14" y="59" class="light" font-family="Inter,Arial" font-size="13">elevated</text><text x="14" y="78" class="n">#21182B</text></g>
    <g transform="translate(720)"><rect width="164" height="90" rx="14" fill="#291B35"/><text x="14" y="59" class="light" font-family="Inter,Arial" font-size="13">mediaFallback</text><text x="14" y="78" class="n">#291B35</text></g>
  </g>
  <text x="40" y="270" class="s">Marca y acciones</text>
  <rect x="40" y="290" width="524" height="76" rx="18" fill="url(#brand)"/><text x="62" y="324" class="light" font-family="Inter,Arial" font-size="15" font-weight="700">Gradiente principal</text><text x="62" y="346" class="light" font-family="Inter,Arial" font-size="12">#8B5CF6 → #A855F7 → #D946EF</text>
  <rect x="580" y="290" width="164" height="76" rx="18" fill="#F0ABFC"/><text x="596" y="324" class="dark" font-family="Inter,Arial" font-size="13" font-weight="700">fuchsiaText</text><text x="596" y="345" class="dark" font-family="Inter,Arial" font-size="12">#F0ABFC</text>
  <rect x="760" y="290" width="164" height="76" rx="18" fill="#FB7185"/><text x="776" y="324" class="dark" font-family="Inter,Arial" font-size="13" font-weight="700">rose</text><text x="776" y="345" class="dark" font-family="Inter,Arial" font-size="12">#FB7185</text>
  <text x="40" y="410" class="s">Estados semánticos</text>
  <g font-family="Inter,Arial" font-size="13" font-weight="700">
    <g transform="translate(40 430)"><rect width="124" height="44" rx="22" fill="#6EE7B7" fill-opacity=".12" stroke="#6EE7B7" stroke-opacity=".35"/><circle cx="22" cy="22" r="5" fill="#6EE7B7"/><text x="36" y="27" fill="#6EE7B7">Disponible</text></g>
    <g transform="translate(176 430)"><rect width="124" height="44" rx="22" fill="#A78BFA" fill-opacity=".15" stroke="#A78BFA" stroke-opacity=".35"/><circle cx="22" cy="22" r="5" fill="#A78BFA"/><text x="36" y="27" fill="#A78BFA">Reservada</text></g>
    <g transform="translate(312 430)"><rect width="112" height="44" rx="22" fill="#E879F9" fill-opacity=".15" stroke="#E879F9" stroke-opacity=".35"/><circle cx="22" cy="22" r="5" fill="#E879F9"/><text x="36" y="27" fill="#E879F9">Ocupada</text></g>
    <g transform="translate(436 430)"><rect width="114" height="44" rx="22" fill="#FDE68A" fill-opacity=".12" stroke="#FDE68A" stroke-opacity=".35"/><circle cx="22" cy="22" r="5" fill="#FDE68A"/><text x="36" y="27" fill="#FDE68A">Limpieza</text></g>
    <g transform="translate(562 430)"><rect width="150" height="44" rx="22" fill="#FCD34D" fill-opacity=".12" stroke="#FCD34D" stroke-opacity=".35"/><circle cx="22" cy="22" r="5" fill="#FCD34D"/><text x="36" y="27" fill="#FCD34D">Mantenimiento</text></g>
    <g transform="translate(724 430)"><rect width="128" height="44" rx="22" fill="#FB7185" fill-opacity=".12" stroke="#FB7185" stroke-opacity=".35"/><circle cx="22" cy="22" r="5" fill="#FECDD3"/><text x="36" y="27" fill="#FECDD3">Bloqueada</text></g>
  </g>
  <text x="40" y="520" class="s">Jerarquía de texto sobre fondo oscuro</text>
  <text x="40" y="554" font-family="Inter,Arial" font-size="16" font-weight="700" fill="#F8F6FF">Texto primario · #F8F6FF</text>
  <text x="330" y="554" font-family="Inter,Arial" font-size="16" fill="#ffffff" fill-opacity=".55">Texto secundario · 55 %</text>
  <text x="610" y="554" font-family="Inter,Arial" font-size="16" fill="#ffffff" fill-opacity=".40">Texto muted · 40 %</text>
  <text x="40" y="587" class="n">Vista de referencia. La implementación debe consumir los tokens definidos en ThemeData.</text>
</svg>
