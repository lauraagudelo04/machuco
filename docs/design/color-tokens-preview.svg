<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc">
  <title id="title">Todos los tokens de color de MACHUCO</title><desc id="desc">Muestras de fondos, texto, marca y estados semánticos en modo oscuro.</desc>
  <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#8B5CF6"/><stop offset=".5" stop-color="#A855F7"/><stop offset="1" stop-color="#D946EF"/></linearGradient><style>.h{font:700 22px Inter,Arial;fill:#F8F6FF}.s{font:700 14px Inter,Arial;fill:#F8F6FF}.n{font:500 11px Inter,Arial;fill:#BDB7C5}.v{font:600 12px Inter,Arial;fill:#F8F6FF}</style></defs>
  <rect width="960" height="760" rx="24" fill="#0D0913"/><text x="36" y="44" class="h">MACHUCO · Tokens de color</text><text x="36" y="68" class="n">Referencia visual en fondo oscuro · los valores escritos son la fuente de verdad</text>
