<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">Tokens de bordes, sombras y movimiento de MACHUCO</title><desc id="desc">Comparación visual de bordes, sombras, duraciones y curvas.</desc><defs><filter id="cta"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8B5CF6" flood-opacity=".35"/></filter><filter id="fab"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#8B5CF6" flood-opacity=".4"/></filter><style>.h{font:700 21px Inter,Arial;fill:#F8F6FF}.s{font:700 14px Inter,Arial;fill:#F8F6FF}.n{font:500 11px Inter,Arial;fill:#BDB7C5}</style></defs><rect width="960" height="500" rx="24" fill="#0D0913"/><text x="36" y="44" class="h">Bordes, sombras y movimiento</text><text x="36" y="78" class="s">Bordes</text><g transform="translate(36 96)"><rect width="190" height="72" rx="14" fill="#15111F" stroke="#fff" stroke-opacity=".07"/><text x="16" y="34" class="s">Normal</text><text x="16" y="54" class="n">blanco 7 %</text><rect x="210" width="190" height="72" rx="14" fill="#15111F" stroke="#fff" stroke-opacity=".12"/><text x="226" y="34" class="s">Fuerte</text><text x="226" y="54" class="n">blanco 12 %</text><rect x="420" width="190" height="72" rx="14" fill="#15111F" stroke="#8B5CF6" stroke-opacity=".44" stroke-width="2"/><text x="436" y="34" class="s">Foco suave</text><text x="436" y="54" class="n">violeta 44 %</text><rect x="630" width="190" height="72" rx="14" fill="#15111F" stroke="#8B5CF6" stroke-width="2"/><text x="646" y="34" class="s">Foco sólido</text><text x="646" y="54" class="n">#8B5CF6</text></g><text x="36" y="210" class="s">Sombras</text><rect x="36" y="230" width="240" height="58" rx="16" fill="#8B5CF6" filter="url(#cta)"/><text x="156" y="264" text-anchor="middle" class="s">CTA · 0 8 28 · 35 %</text><circle cx="348" cy="259" r="34" fill="#A855F7" filter="url(#fab)"/><text x="402" y="255" class="s">FAB</text><text x="402" y="276" class="n">0 8 28 · 40 %</text><rect x="600" y="230" width="220" height="58" rx="16" fill="#15111F" stroke="#fff" stroke-opacity=".07"/><text x="710" y="255" text-anchor="middle" class="s">Card</text><text x="710" y="275" text-anchor="middle" class="n">sin sombra intensa</text><text x="36" y="342" class="s">Movimiento</text><line x1="58" y1="397" x2="876" y2="397" stroke="#fff" stroke-opacity=".18" stroke-width="4"/><g fill="#D946EF"><circle cx="156" cy="397" r="9"/><circle cx="346" cy="397" r="9"/><circle cx="624" cy="397" r="9"/></g><g class="n"><text x="156" y="374" text-anchor="middle">fast · 120 ms</text><text x="346" y="374" text-anchor="middle">normal · 220 ms</text><text x="624" y="374" text-anchor="middle">slow · 360 ms</text><text x="36" y="446">Presión: 100–160 ms</text><text x="228" y="446">Contenido: 180–240 ms</text><text x="446" y="446">Pantalla/sheet: 250–360 ms</text><text x="36" y="474">Curvas: standard = easeOutCubic · emphasized = easeInOutCubicEmphasized</text></g></svg>
